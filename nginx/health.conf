server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root   /usr/share/nginx/html;
  index  index.html;

  # JSON health endpoint (for Kubernetes probes)
  location = /healthz {
    default_type application/json;
    add_header Content-Type application/json;
    return 200 '{"status":"ok"}';
  }

  # API proxy to backend service (avoids CORS)
  location /v1/ {
    proxy_pass http://floodsight-backend.floodsight.svc.cluster.local:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Try static files first, fall back to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "0" always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

