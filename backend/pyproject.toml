[tool.poetry]
name = "floodsight-backend"
version = "0.1.0"
description = "FloodSight Backend API - Real-time flood monitoring and forecasting"
authors = ["FloodSight Team"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"
httpx = "^0.26.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
python-multipart = "^0.0.9"
prometheus-client = "^0.19.0"
psutil = "^5.9.6"  # Process and system metrics
aiohttp = "^3.9.1"
aiosmtplib = "^3.0.1"
geoalchemy2 = "^0.14.3"
psycopg2-binary = "^2.9.9"
apscheduler = "^3.10.4"
cdsapi = "^0.7.7"  # New CDS API with Personal Access Tokens
xarray = "^2024.11.0"
netCDF4 = "^1.7.3"
pandas = "^2.2.2"
scipy = "^1.11.4"  # SAR vessel detection (CFAR)
shapely = "^2.0.2"  # Geometry operations
numpy = "^1.26.3"  # Array processing

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

