repos:
  - repo: https://github.com/lycheeverse/lychee
    rev: v0.14.3
    hooks:
      - id: lychee
        args: ["--no-progress", "*.html", "**/*.md"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=500"]

