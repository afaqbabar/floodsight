<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Connection Test</title>
    <style>
      body {
        font-family: 'Courier New', monospace;
        padding: 20px;
        background: #1a1a1a;
        color: #00ff00;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #000;
        padding: 20px;
        border: 2px solid #00ff00;
        border-radius: 8px;
      }
      h1 {
        color: #00ff00;
      }
      .result {
        background: #0a0a0a;
        padding: 15px;
        margin: 10px 0;
        border-left: 3px solid #00ff00;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error {
        border-left-color: #ff0000;
        color: #ff0000;
      }
      .success {
        border-left-color: #00ff00;
        color: #00ff00;
      }
      button {
        background: #00ff00;
        color: #000;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #00dd00;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔧 FloodSight API Connection Diagnostic</h1>

      <div class="result">
        Current URL: <span id="currentUrl"></span> Detected Hostname:
        <span id="hostname"></span> API Base URL: <span id="apiUrl"></span>
      </div>

      <button onclick="testHealth()">Test /health</button>
      <button onclick="testStations()">Test /stations</button>
      <button onclick="testAlerts()">Test /alerts</button>
      <button onclick="testAll()">Test All</button>

      <h2>Results:</h2>
      <div id="results"></div>
    </div>

    <script type="module">
      import * as API from '/assets/js/api-service.js';

      // Display current configuration
      document.getElementById('currentUrl').textContent = window.location.href;
      document.getElementById('hostname').textContent = window.location.hostname;

      const config = API.getAPIConfig();
      document.getElementById('apiUrl').textContent = config.baseUrl;

      function addResult(title, data, isError = false) {
        const resultsDiv = document.getElementById('results');
        const resultDiv = document.createElement('div');
        resultDiv.className = `result ${isError ? 'error' : 'success'}`;
        resultDiv.innerHTML = `<strong>${title}</strong>\n${JSON.stringify(data, null, 2)}`;
        resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
      }

      window.testHealth = async function () {
        try {
          const result = await API.getHealth();
          addResult('✅ GET /health - SUCCESS', result);
        } catch (error) {
          addResult(
            '❌ GET /health - FAILED',
            {
              error: error.message,
              stack: error.stack,
            },
            true
          );
        }
      };

      window.testStations = async function () {
        try {
          const result = await API.getStations();
          addResult('✅ GET /stations - SUCCESS', {
            count: result.length,
            sample: result[0],
          });
        } catch (error) {
          addResult(
            '❌ GET /stations - FAILED',
            {
              error: error.message,
            },
            true
          );
        }
      };

      window.testAlerts = async function () {
        try {
          const result = await API.getActiveAlerts();
          addResult('✅ GET /alerts - SUCCESS', {
            count: result.length,
            sample: result[0],
          });
        } catch (error) {
          addResult(
            '❌ GET /alerts - FAILED',
            {
              error: error.message,
            },
            true
          );
        }
      };

      window.testAll = async function () {
        await testHealth();
        await testStations();
        await testAlerts();
      };

      // Auto-run on load
      testHealth();
    </script>
  </body>
</html>
