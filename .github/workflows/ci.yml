name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # Code Quality Checks
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check code formatting
        run: npm run format:check || true
        continue-on-error: true

      - name: Validate HTML
        run: npm run lint:html || true
        continue-on-error: true

  # Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Build application
        env:
          VITE_API_BASE_URL: https://shoe-mere-livestock-mild.trycloudflare.com/v1
          VITE_MAP_PROVIDER: openstreetmap
          VITE_MAP_DEFAULT_LAT: "51.5074"
          VITE_MAP_DEFAULT_LNG: "-0.1278"
          VITE_MAP_DEFAULT_ZOOM: "11"
          VITE_ENABLE_ALERTS: "true"
          VITE_ENABLE_FORECASTING: "true"
          VITE_ENABLE_HISTORICAL_DATA: "true"
          VITE_FLOOD_DATA_API: https://environment.data.gov.uk/flood-monitoring
        run: npm run build
        continue-on-error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # End-to-End Tests
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Lighthouse Performance
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Build and serve
        run: |
          npm run build
          npm run preview &
          sleep 5

      - name: Run Lighthouse
        run: npm run lighthouse || true
        continue-on-error: true

  # Build and Push Docker Image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Build static site
        env:
          VITE_API_BASE_URL: https://shoe-mere-livestock-mild.trycloudflare.com/v1
          VITE_MAP_PROVIDER: openstreetmap
          VITE_MAP_DEFAULT_LAT: "51.5074"
          VITE_MAP_DEFAULT_LNG: "-0.1278"
          VITE_MAP_DEFAULT_ZOOM: "11"
          VITE_ENABLE_ALERTS: "true"
          VITE_ENABLE_FORECASTING: "true"
          VITE_ENABLE_HISTORICAL_DATA: "true"
          VITE_FLOOD_DATA_API: https://environment.data.gov.uk/flood-monitoring
        run: |
          echo "🏗️ Building static site with production API URL..."
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build || {
            echo "❌ Build failed! Checking for Rollup error..."
            npm run build 2>&1 | grep -i rollup || true
            exit 1
          }
          echo "📦 Build completed. Checking dist folder..."
          if [ -d "dist" ]; then
            echo "✅ dist folder exists"
            ls -lah dist/ | head -20
            echo "📊 Total files in dist:"
            find dist -type f | wc -l
          else
            echo "❌ ERROR: dist folder not created!"
            echo "📁 Current directory contents:"
            ls -la
            exit 1
          fi

      - name: Verify Docker build context
        run: |
          echo "🔍 Verifying Docker build context..."
          echo "Contents of .dockerignore:"
          cat .dockerignore | grep -A2 -B2 "dist" || echo "No dist entry in .dockerignore"
          echo ""
          echo "Checking if dist/ exists in current directory:"
          ls -la dist/ || echo "dist/ not found!"
          echo ""
          echo "Files that will be sent to Docker:"
          tar -czf - . --exclude='.git' 2>/dev/null | tar -tz | grep "^dist/" | head -10 || echo "No dist files in context"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to Vercel (Production)
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    environment:
      name: production
      url: https://floodsight.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          cd dist
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Trigger ArgoCD Sync (GitOps)
  gitops-sync:
    name: Sync GitOps (ArgoCD)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger ArgoCD Sync
        run: |
          echo "🔄 ArgoCD will automatically detect changes"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "✅ GitOps sync triggered"
        # In production, you would use ArgoCD CLI or API here
        # argocd app sync floodsight --grpc-web

  # Notification
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-vercel, docker]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "🚀 Deployment completed"
          echo "📊 Dashboard: https://floodsight.vercel.app/dashboard-figma.html"
          echo "🏠 Homepage: https://floodsight.vercel.app"
