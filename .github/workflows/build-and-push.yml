name: Build static site & push image
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          echo "🔍 Checking for Rollup binary..."
          if [ ! -f "node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node" ]; then
            echo "⚠️ Rollup x64 binary not found, installing explicitly..."
            npm install --save-optional @rollup/rollup-linux-x64-gnu
          fi
          ls -la node_modules/@rollup/rollup-linux-x64-gnu/ || echo "❌ Rollup binary still missing!"

      - name: Build static site
        run: |
          echo "🏗️ Building static site..."
          npm run build
          echo "📦 Build completed. Checking dist folder..."
          if [ -d "dist" ]; then
            echo "✅ dist folder exists"
            ls -lah dist/ | head -20
            echo "📊 Total files in dist:"
            find dist -type f | wc -l
          else
            echo "❌ ERROR: dist folder not created!"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=dev-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push (multi-arch for arm64/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.nginx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            GIT_BRANCH=${{ github.ref_name }}
            IMAGE_REF=ghcr.io/${{ github.repository }}-frontend:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:buildcache,mode=max

