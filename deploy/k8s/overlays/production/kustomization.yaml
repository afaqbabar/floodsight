apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: floodsight-production

namespace: floodsight-prod

bases:
- ../../base

# Production-specific labels
commonLabels:
  environment: production
  tier: production

# Production-specific annotations
commonAnnotations:
  environment: "production"
  monitoring: "enabled"

# Replica count for production
replicas:
- name: floodsight
  count: 5

# Production image with specific tag
images:
- name: ghcr.io/yourusername/floodsight
  newTag: v1.0.0

# Production ConfigMap overrides
configMapGenerator:
- name: floodsight-config
  behavior: merge
  literals:
  - NODE_ENV=production
  - VITE_API_BASE_URL=https://api.floodsight.com
  - VITE_ENABLE_ANALYTICS=true

# Production patches
patches:
- target:
    kind: Deployment
    name: floodsight
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "1000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "256Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "1Gi"

- target:
    kind: Ingress
    name: floodsight
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: "floodsight.com"
    - op: replace
      path: /spec/rules/1/host
      value: "www.floodsight.com"
    - op: replace
      path: /spec/tls/0/hosts/0
      value: "floodsight.com"
    - op: replace
      path: /spec/tls/0/hosts/1
      value: "www.floodsight.com"

- target:
    kind: HorizontalPodAutoscaler
    name: floodsight
  patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 5
    - op: replace
      path: /spec/maxReplicas
      value: 20

