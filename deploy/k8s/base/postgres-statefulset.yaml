apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: floodsight
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        # Use pre-built PostGIS image with ARM64 support
        image: nickblah/postgis:16-postgis-3.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: floodsight
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: floodsight-backend-secrets
              key: postgres-password
              optional: true
        # Note: If secret doesn't exist, PostgreSQL will use default or fail
        # For production, ensure floodsight-backend-secrets/postgres-password exists
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

