apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodsight-backend
  namespace: floodsight
  labels:
    app: floodsight
    component: backend
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: floodsight
      component: backend
  template:
    metadata:
      labels:
        app: floodsight
        component: backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: floodsight
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/afaqbabar/floodsight-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: floodsight-backend-secrets
              key: database-url
        - name: SUPABASE_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: floodsight-backend-secrets
              key: supabase-jwks-url
              optional: true
        - name: CDS_API_KEY
          valueFrom:
            secretKeyRef:
              name: floodsight-backend-secrets
              key: cds-api-key
              optional: true
        # Note: GLOFAS and CDS settings are loaded from ConfigMap via envFrom below
        envFrom:
        - configMapRef:
            name: floodsight-backend-config
        - secretRef:
            name: floodsight-backend-secrets
            optional: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - floodsight
                - key: component
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodsight-scheduler
  namespace: floodsight
  labels:
    app: floodsight
    component: scheduler
    tier: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: floodsight
      component: scheduler
  template:
    metadata:
      labels:
        app: floodsight
        component: scheduler
        tier: worker
    spec:
      serviceAccountName: floodsight
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scheduler
        image: ghcr.io/afaqbabar/floodsight-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.workers.flows", "schedule"]
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: floodsight-backend-secrets
              key: database-url
        - name: CDS_API_KEY
          valueFrom:
            secretKeyRef:
              name: floodsight-backend-secrets
              key: cds-api-key
              optional: true
        # Note: GLOFAS and CDS settings are loaded from ConfigMap via envFrom below
        envFrom:
        - configMapRef:
            name: floodsight-backend-config
        - secretRef:
            name: floodsight-backend-secrets
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

