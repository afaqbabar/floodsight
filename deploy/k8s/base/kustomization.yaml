apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    config.kubernetes.io/index: "0"
  name: floodsight-base

namespace: floodsight

# Common labels for all resources
commonLabels:
  app.kubernetes.io/component: frontend
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/name: floodsight
  app.kubernetes.io/part-of: floodsight-platform

# Common annotations
commonAnnotations:
  maintainer: FloodSight Team
  version: 1.0.0

# Frontend resources
# Backend resources
# Database resources
resources:
- serviceaccount.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
- backend-configmap.yaml
- backend-deployment.yaml
- backend-service.yaml
- backend-ingress.yaml
- postgres-statefulset.yaml
# Note: backend-secrets.yaml must be created from backend-secrets.yaml.example
# and applied separately for security reasons

# Image configuration
images:
- digest: sha256:a45412c960a9159537c0d6ca3b50e10b83088b2040ada9720aa887de9455ba9d
  name: ghcr.io/afaqbabar/floodsight-backend
  newName: ghcr.io/afaqbabar/floodsight-backend
  newTag: latest
- name: ghcr.io/afaqbabar/floodsight-postgres-postgis
  newTag: latest
- name: ghcr.io/yourusername/floodsight
  newName: ghcr.io/afaqbabar/floodsight-frontend
  newTag: latest

# ConfigMap generator (optional)
configMapGenerator:
- literals:
  - APP_NAME=FloodSight
  - APP_VERSION=1.0.0
  name: floodsight-env

# Secret generator (optional, for development)
# secretGenerator:
# - name: floodsight-secrets
#   literals:
#   - API_KEY=changeme

# Patches
patches:
- patch: |-
    - op: add
      path: /spec/template/metadata/annotations/build-timestamp
      value: "BUILD_TIMESTAMP_PLACEHOLDER"
  target:
    kind: Deployment
    name: floodsight
