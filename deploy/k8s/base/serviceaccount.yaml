apiVersion: v1
kind: ServiceAccount
metadata:
  name: floodsight
  labels:
    app: floodsight
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: floodsight
  labels:
    app: floodsight
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: floodsight
  labels:
    app: floodsight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: floodsight
subjects:
- kind: ServiceAccount
  name: floodsight

