apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: floodsight-frontend-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: floodsight
    app.kubernetes.io/component: frontend
    environment: staging
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: floodsight-staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/afaqbabar/floodsight.git
    targetRevision: develop
    path: deploy/k8s/overlays/staging
    kustomize:
      version: v5.0.0
      commonLabels:
        app.kubernetes.io/managed-by: argocd
      images:
        - ghcr.io/afaqbabar/floodsight:staging-latest
  
  destination:
    server: https://kubernetes.default.svc
    namespace: floodsight-staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  
  revisionHistoryLimit: 5
  
  # Health assessment
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  
  info:
  - name: URL
    value: https://staging.floodsight.com
  - name: Dashboard
    value: https://staging.floodsight.com/dashboard-figma.html

